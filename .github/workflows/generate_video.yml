name: 🎬 AI Video Generator

on:
  # Run automatically every Monday, Wednesday, Friday at 9AM IST (3:30 AM UTC)
  schedule:
    - cron: "30 3 * * 1,3,5"

  # Also allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche to generate video for"
        required: false
        default: "health_food"
        type: choice
        options:
          - health_food
          - psychology
          - tech_ai
      topic:
        description: "Custom topic (leave empty for AI to pick)"
        required: false
        default: ""

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Max 1 hour per video

    steps:
      # ── Setup ──────────────────────────────────────────────────────────────
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core \
            imagemagick \
            libmagickwand-dev \
            python3-dev

          # Fix ImageMagick policy for text rendering (needed by MoviePy)
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' \
            /etc/ImageMagick-6/policy.xml || true

      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            moviepy==1.0.3 \
            Pillow==10.3.0 \
            edge-tts==6.1.9 \
            aiohttp==3.9.5 \
            aiofiles==23.2.1 \
            supabase==2.4.6 \
            mutagen==1.47.0 \
            numpy==1.26.4 \
            google-api-python-client==2.131.0 \
            google-auth-httplib2==0.2.0 \
            google-auth-oauthlib==1.2.0

      # ── Create dirs ────────────────────────────────────────────────────────
      - name: 📁 Create output directories
        run: |
          mkdir -p outputs/videos outputs/audio outputs/image_cache config

      # ── YouTube credentials ────────────────────────────────────────────────
      - name: 🔑 Setup YouTube credentials
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          if [ -n "$YOUTUBE_CREDENTIALS" ]; then
            echo "$YOUTUBE_CREDENTIALS" > config/youtube_credentials.json
          fi
          if [ -n "$YOUTUBE_TOKEN" ]; then
            echo "$YOUTUBE_TOKEN" | base64 -d > config/youtube_token.pickle
          fi

      # ── Generate Video ─────────────────────────────────────────────────────
      - name: 🎬 Generate video
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NICHE="${{ github.event.inputs.niche || 'health_food' }}"
          TOPIC="${{ github.event.inputs.topic || '' }}"

          echo "🚀 Starting video generation..."
          echo "Niche: $NICHE"

          if [ -n "$TOPIC" ]; then
            python main.py "$NICHE" "$TOPIC"
          else
            python main.py "$NICHE"
          fi

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: 📤 Save video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_number }}
          path: outputs/videos/*.mp4
          retention-days: 7  # Keep for 7 days (free tier limit)

      - name: 📊 Save generation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-log-${{ github.run_number }}
          path: outputs/**/*.json
          retention-days: 30
